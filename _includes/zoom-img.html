<div style="width:100%;display:block;"><button onclick="this.nextElementSibling.showModal()" style="background:none;border:none;padding:0;cursor:pointer;width:100%;display:block;text-align:left;"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" style="width:100%;height:auto;"></button><dialog onclick="this.close()" style="border:none;background:transparent;padding:0;width:95vw;max-width:1400px;max-height:85vh;overflow:auto;outline:none;margin:auto;"><div style="width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;"><img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" style="max-width:none;width:auto;height:auto;max-height:75vh;box-shadow:0 4px 25px rgba(0,0,0,0.6);border-radius:4px;"></div><p style="color:#ccc;text-align:center;margin-top:12px;font-size:14px;font-family:sans-serif;user-select:none;">(Touch or click anywhere to close)</p></dialog></div>
